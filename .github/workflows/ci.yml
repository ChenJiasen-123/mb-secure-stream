name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  mbt-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          echo "✅ MoonBit installed, PATH updated"
          export PATH="$HOME/.moon/bin:$PATH"
          moon version

      - name: moon check -d
        shell: bash
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon check -d

      - name: moon fmt --check
        shell: bash
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon fmt --check crypto/mb-aead crypto/mb-chacha \
            crypto/mb-getrandom crypto/mb-hash crypto/mb-hkdf \
            crypto/mb-hmac crypto/mb-jwt crypto/mb-p256 \
            crypto/mb-poly1305 crypto/mb-secretstream gateway examples/secretstream-file/bridge examples/secretstream-wasm examples/secretstream-typed
          moon fmt --check gateway/src

      - name: moon info
        shell: bash
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon info

      - name: moon test
        shell: bash
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Secretstream JS tests and bridge
        run: |
          moon test crypto/mb-secretstream/src --target js
          moon test gateway/src --target js
          moon test crypto/mb-jwt/src --target js
          moon test crypto/mb-getrandom/src/lib --target js
          moon build --target js examples/secretstream-file/bridge
          node --test tools/test_secretstream_cli.cjs
          moon run examples/secretstream-typed --target js

      - name: Secretstream Native protocol and OS entropy tests
        run: |
          moon test crypto/mb-secretstream/src --target native
          moon test gateway/src --target native
          moon test crypto/mb-getrandom/src/lib --target native

      - name: WasmGC Web Crypto host integration
        run: |
          moon build --target wasm-gc examples/secretstream-wasm
          mkdir -p verification
          node tools/verify_secretstream_wasm.cjs verification/wasm-host.json

      - name: Independent libsodium file interoperability
        run: |
          python -m pip install -r tools/requirements-dev.txt
          mkdir -p verification
          python tools/generate_poly1305_boundary_vectors.py
          moon fmt crypto/mb-poly1305
          git diff --exit-code -- crypto/mb-poly1305/src/boundaries_test.mbt
          python tools/generate_secretstream_counter_vectors.py
          moon fmt crypto/mb-secretstream
          git diff --exit-code -- crypto/mb-secretstream/fixtures/counter-wrap.json crypto/mb-secretstream/src/counter_wrap_wbtest.mbt
          python tools/verify_secretstream_differential.py verification/differential.json
          python tools/verify_secretstream_files.py verification/interop-4k.json 1 --chunk-bytes 4096
          python tools/verify_secretstream_files.py verification/interop-64k.json 1 --chunk-bytes 65536
          python examples/secure-backup/demo.py verification/backup-demo.json

      - name: Published Mooncakes consumer installation
        run: python tools/verify_published_install.py verification/published-consumer.json

      - uses: actions/upload-artifact@v4
        with:
          name: secretstream-interoperability
          path: verification/*.json
